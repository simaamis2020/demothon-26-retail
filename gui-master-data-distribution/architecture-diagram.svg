    <circle cx="1110" cy="381" r="18" class="brokerCircle"/>
    <path d="M1101 377h18M1110 368v18" class="iconStroke" stroke="#FFFFFF"/>
    <text x="1146" y="368" class="label">Live Operations Dashboard</text>
    <text x="1146" y="390" class="small">Subscriptions, KPIs, toasts and routing view</text>
    <text x="1146" y="410" class="small">Shows only events that actually arrive</text>
    <rect x="1146" y="416" width="190" height="18" rx="9" class="pill"/>
    <text x="1158" y="429" class="small">Editable store subscriptions in the UI</text>
  </g>

  <rect x="360" y="496" width="1080" height="150" rx="18" class="storePanel"/>
  <text x="382" y="528" class="section">Store Edge Layer</text>

  <g filter="url(#shadow)">
    <rect x="390" y="548" width="220" height="74" rx="14" class="cardMuted"/>
    <circle cx="428" cy="585" r="16" class="brokerCircle"/>
    <text x="458" y="580" class="label">Germany Store 101</text>
    <text x="458" y="600" class="small">Local edge broker + POS / ESL</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="548" width="220" height="74" rx="14" class="cardMuted"/>
    <circle cx="688" cy="585" r="16" class="brokerCircle"/>
    <text x="718" y="580" class="label">Canada Store 102</text>
    <text x="718" y="600" class="small">Local edge broker + POS / ESL</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="910" y="548" width="220" height="74" rx="14" class="cardMuted"/>
    <circle cx="948" cy="585" r="16" class="brokerCircle"/>
    <text x="978" y="580" class="label">France Store 103</text>
    <text x="978" y="600" class="small">Local edge broker + POS / ESL</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1170" y="548" width="220" height="74" rx="14" class="cardMuted"/>
    <circle cx="1208" cy="585" r="16" class="brokerCircle"/>
    <text x="1238" y="580" class="label">Australia Store 104</text>
    <text x="1238" y="600" class="small">Local edge broker + POS / ESL</text>
  </g>

  <path d="M720 216H795" class="line" marker-end="url(#arrow)"/>
  <path d="M1075 216H1140" class="line" marker-end="url(#arrow)"/>
  <path d="M600 322V264H600" class="line" marker-end="url(#arrow)"/>
  <path d="M850 322V264" class="line" marker-end="url(#arrow)"/>
  <path d="M1225 322V264H1215" class="line" marker-end="url(#arrow)"/>

  <path d="M600 216V496" class="line dashed" marker-end="url(#arrow)"/>
  <path d="M935 216V496" class="line dashed" marker-end="url(#arrow)"/>

  <path d="M600 520H500V548" class="line" marker-end="url(#arrow)"/>
  <path d="M720 520H760V548" class="line" marker-end="url(#arrow)"/>
  <path d="M935 520H1020V548" class="line" marker-end="url(#arrow)"/>
  <path d="M935 520H1280V548" class="line" marker-end="url(#arrow)"/>

  <path d="M500 622V662H600" class="line thin" marker-end="url(#arrow)"/>
  <path d="M760 622V662H600" class="line thin" marker-end="url(#arrow)"/>
  <path d="M1020 622V662H600" class="line thin" marker-end="url(#arrow)"/>
  <path d="M1280 622V662H600" class="line thin" marker-end="url(#arrow)"/>
  <text x="618" y="676" class="small">POS and local consumers publish events back to the hub</text>

  <g filter="url(#shadow)">
    <rect x="70" y="206" width="150" height="84" rx="14" class="cardMuted"/>
    <circle cx="110" cy="248" r="20" fill="#123A56"/>
    <path d="M100 247h20M110 237v20" class="iconStroke" stroke="#FFFFFF"/>
    <text x="154" y="238" class="label">Retail Source</text>
    <text x="154" y="258" class="small">ERP / MDM / pricing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="330" width="150" height="84" rx="14" class="cardMuted"/>
    <circle cx="110" cy="372" r="20" fill="#123A56"/>
    <path d="M101 372h18M110 363v18" class="iconStroke" stroke="#FFFFFF"/>
    <text x="154" y="362" class="label">Demo UI</text>
    <text x="154" y="382" class="small">Connect / subscribe / publish</text>
  </g>

  <path d="M220 248H350V216H480" class="line" marker-end="url(#arrow)"/>
  <path d="M220 372H330V381H370" class="line" marker-end="url(#arrow)"/>

  <g>
    <rect x="74" y="804" width="128" height="24" rx="12" fill="#FFFFFF" stroke="#12C48B"/>
    <text x="92" y="820" class="small">Demo architecture</text>
  </g>

  <text x="1410" y="834" style="font:700 28px 'Avenir Next', Arial, sans-serif; fill:#12C48B;">solace.</text>

    <text x="870" y="228" class="small">Topic compaction MI</text>
    <text x="870" y="246" class="small">Latest product state + replay</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1140" y="168" width="250" height="96" rx="14" class="card"/>
    <circle cx="1180" cy="216" r="18" class="brokerCircle"/>
    <path d="M1171 217l6 6 12-14" class="iconStroke" stroke="#FFFFFF"/>
    <text x="1214" y="208" class="label">Replay Status Events</text>
    <text x="1214" y="228" class="small">`replayStatus` back to the UI</text>
    <text x="1214" y="246" class="small">Success / failure confirmation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="322" width="260" height="118" rx="14" class="card"/>
    <circle cx="410" cy="381" r="18" class="brokerCircle"/>

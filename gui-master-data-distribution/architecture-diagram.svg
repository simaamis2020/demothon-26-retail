<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFD"/>
      <stop offset="1" stop-color="#EEF6F9"/>
    </linearGradient>
    <linearGradient id="meshPanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5FBFD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#143B54" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px 'Avenir Next', Arial, sans-serif; fill: #123A56; }
      .section { font: 700 22px 'Avenir Next', Arial, sans-serif; fill: #123A56; }
      .label { font: 700 14px 'Avenir Next', Arial, sans-serif; fill: #123A56; }
      .small { font: 500 12px 'Avenir Next', Arial, sans-serif; fill: #5A7487; }
      .card { fill: #FFFFFF; stroke: #12C48B; stroke-width: 2; }
      .cardMuted { fill: #FFFFFF; stroke: #C8D8E1; stroke-width: 2; }
      .meshBox { fill: url(#meshPanel); stroke: #12C48B; stroke-width: 2; }
      .line { stroke: #123A56; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke-width: 1.8; }
      .dashed { stroke-dasharray: 9 8; }
      .pill { fill: #EAF8F3; stroke: #12C48B; stroke-width: 1.4; }
      .storePanel { fill: #F9FCFD; stroke: #D3E2EA; stroke-width: 1.5; }
      .brokerCircle { fill: #12C48B; }
      .iconFill { fill: #123A56; }
      .iconStroke { stroke: #123A56; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0 0L12 6L0 12V0Z" fill="#123A56"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <rect x="0" y="86" width="1600" height="3" fill="#12C48B"/>

  <text x="70" y="62" class="title">Retail Master Data Distribution Demo with Solace Agent Mesh</text>

  <g transform="translate(1380 42)">
    <circle cx="18" cy="16" r="12" fill="#12C48B"/>
    <circle cx="42" cy="16" r="12" fill="#12C48B"/>
    <circle cx="66" cy="16" r="12" fill="#12C48B"/>
    <circle cx="42" cy="40" r="12" fill="#12C48B"/>
    <circle cx="66" cy="40" r="12" fill="#12C48B"/>
    <circle cx="90" cy="40" r="12" fill="#12C48B" opacity="0.45"/>
    <circle cx="90" cy="16" r="12" fill="none" stroke="#8EA8B9"/>
    <circle cx="114" cy="16" r="12" fill="none" stroke="#8EA8B9"/>
    <circle cx="138" cy="16" r="12" fill="none" stroke="#8EA8B9"/>
    <circle cx="114" cy="40" r="12" fill="none" stroke="#8EA8B9"/>
    <circle cx="138" cy="40" r="12" fill="none" stroke="#8EA8B9"/>
    <circle cx="162" cy="40" r="12" fill="none" stroke="#8EA8B9"/>
  </g>

  <rect x="300" y="112" width="1210" height="580" rx="18" class="meshBox" filter="url(#shadow)"/>
  <text x="320" y="144" class="section">Solace Event Mesh</text>

  <g filter="url(#shadow)">
    <rect x="480" y="168" width="240" height="96" rx="14" class="card"/>
    <circle cx="520" cy="216" r="18" class="brokerCircle"/>
    <rect x="509" y="208" width="22" height="16" rx="7" fill="#FFFFFF"/>
    <text x="554" y="210" class="label">Hub Broker</text>
    <text x="554" y="232" class="small">Publishes master data updates</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="795" y="168" width="280" height="96" rx="14" class="card"/>
    <circle cx="835" cy="216" r="18" class="brokerCircle"/>
    <path d="M825 214h20M835 204v20" class="iconStroke" stroke="#FFFFFF"/>

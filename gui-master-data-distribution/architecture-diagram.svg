    <text x="445" y="390" class="small">Speech-to-text command events</text>
    <text x="445" y="410" class="small">Published over the same WebSocket session</text>
    <rect x="446" y="416" width="150" height="18" rx="9" class="pill"/>
    <text x="458" y="429" class="small">`voice/command/v1/store-assistant`</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="322" width="320" height="118" rx="14" class="card"/>
    <circle cx="730" cy="381" r="18" class="brokerCircle"/>
    <path d="M720 377h20M730 367v20" class="iconStroke" stroke="#FFFFFF"/>
    <text x="766" y="368" class="label">Agent Mesh</text>
    <text x="766" y="390" class="small">Distribution Agent · Pricing Agent · Cache Agent</text>
    <text x="766" y="410" class="small">Interprets routed events and replay outcomes</text>
    <rect x="766" y="416" width="208" height="18" rx="9" class="pill"/>
    <text x="778" y="429" class="small">Live insights for operations and demo flow</text>
  </g>

  <g filter="url(#shadow)">

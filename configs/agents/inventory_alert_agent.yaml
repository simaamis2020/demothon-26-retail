log:
  stdout_log_level: DEBUG
  log_file_level: DEBUG
  log_file: "inventory_alert_agent.log"

apps:
  - name: "inventory_alert_agent"
    app_base_path: "."
    app_module: "solace_agent_mesh.agent.sac.app"
    broker:
      dev_mode: ${SOLACE_DEV_MODE, false}
      broker_url: ${SOLACE_BROKER_URL, ws://localhost:8080}
      broker_username: ${SOLACE_BROKER_USERNAME, default}
      broker_password: ${SOLACE_BROKER_PASSWORD, default}
      broker_vpn: ${SOLACE_BROKER_VPN, default}
      temporary_queue: ${USE_TEMPORARY_QUEUES, true}
    app_config:
      namespace: "${NAMESPACE}"
      supports_streaming: false
      agent_name: "inventory_alert_agent"
      display_name: "Inventory Alert Agent"
      deployment:
        id: "purchase-triggered-inventory-001"
      instruction: |
        You are the Inventory Alert Agent. When you receive a purchase completion event, check stock levels and send alerts if needed.

        **STEP 1: Parse Purchase Event**
        Extract the PLU and purchase details from the input JSON: {"employee_id": "E001", "plu": "94011", "product_name": "...", "old_stock": 10, "new_stock": 9}

        **STEP 2: Check Current Stock Level**
        Use demo_sql_query tool: SELECT stock_level, name FROM products WHERE plu = '[extracted_plu]'

        **STEP 3: Determine Alert Status**
        If stock_level <= 5: alert = true
        If stock_level > 5: alert = false

        **STEP 4: Return Inventory Alert JSON**
        Return this exact format:
        {
          "inventory": {
            "alert": [true/false],
            "plu": "[extracted_plu]",
            "product_name": "[product name from DB]",
            "current_stock": [actual_stock_from_db],
            "threshold": 5,
            "message": "[Alert message if alert=true, otherwise 'Stock levels normal']",
            "timestamp": "{{embed:datetime:iso}}"
          }
        }

        **Alert Message Examples:**
        - If alert=true: "⚠️ LOW STOCK ALERT: [product_name] has only [current_stock] units remaining"
        - If alert=false: "Stock levels normal"

        CRITICAL: Only generate alerts when current_stock <= 5
        CRITICAL: Always query the database for current stock - don't trust the purchase event stock numbers
        CRITICAL: Return valid JSON format
      model:
        model: "${LLM_SERVICE_GENERAL_MODEL_NAME}"
        api_base: "${LLM_SERVICE_ENDPOINT}"
        api_key: "${LLM_SERVICE_API_KEY}"
      tools:
        - tool_type: python
          component_module: "sam_sql_database_tool.tools"
          component_base_path: "."
          class_name: "SqlDatabaseTool"
          tool_config:
            tool_name: "demo_sql_query"
            tool_description: "Query the demo mysql database for inventory levels."
            connection_string: "mysql+pymysql://admin:admin@host.minikube.internal:3306/demo"
      session_service:
        type: ${PERSISTENCE_TYPE, sql}
        database_url: ${DATABASE_URL, sqlite:///inventory_alert.db}
        default_behavior: PERSISTENT
      artifact_service:
        type: filesystem
        base_path: /tmp/samv2
        artifact_scope: namespace
      artifact_handling_mode: reference
      enable_embed_resolution: true
      enable_artifact_content_instruction: true
      agent_card:
        description: "Monitors inventory levels after purchases and generates real-time low stock alerts"
        defaultInputModes: ["text"]
        defaultOutputModes: ["text"]
        skills:
          - id: "inventory_monitoring"
            name: "Inventory Monitoring"
            description: "Monitor product stock levels and generate low stock alerts"
          - id: "purchase_event_processing"
            name: "Purchase Event Processing"  
            description: "Process purchase completion events and trigger appropriate alerts"
      agent_card_publishing:
        interval_seconds: 10
      agent_discovery:
        enabled: true
      inter_agent_communication:
        allow_list: ["*"]
        request_timeout_seconds: 60
# ============================================================================
#  A2A Proxy Config — LangGraph Server Integration
#
#  The LangGraph dev server exposes A2A at:
#    Agent card:  http://192.168.4.146:10002/.well-known/agent-card.json?assistant_id=<uuid>
#    A2A endpoint: http://192.168.4.146:10002/a2a/<uuid>
#
#  The proxy needs the full A2A endpoint URL (not the base server URL).
#  Get the assistant_id UUID after running: langgraph dev --port 10002
#  Then: curl http://localhost:10002/assistants/search | python3 -m json.tool
#  Copy the assistant_id and set it below (or in .env as LANGGRAPH_ASSISTANT_ID).
# ============================================================================

log:
  stdout_log_level: ${A2A_PROXY_LOG_LEVEL, INFO}
  log_file_level: DEBUG
  log_file: a2a_proxy_langgraph.log

apps:
  - name: a2a_proxy_langgraph_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.proxies.a2a.app

    broker:
      dev_mode: ${SOLACE_DEV_MODE, false}
      broker_url: ${SOLACE_BROKER_URL, ws://localhost:8080}
      broker_username: ${SOLACE_BROKER_USERNAME, default}
      broker_password: ${SOLACE_BROKER_PASSWORD, default}
      broker_vpn: ${SOLACE_BROKER_VPN, default}
      temporary_queue: ${USE_TEMPORARY_QUEUES, true}

    app_config:
      namespace: ${NAMESPACE}
      supports_streaming: false
      agent_name: "A2A-Proxy-LangGraph"
      display_name: "A2A Proxy (LangGraph)"

      artifact_service:
        type: filesystem
        base_path: /tmp/samv2
        artifact_scope: namespace

      artifact_handling_mode: "reference"
      discovery_interval_seconds: ${A2A_PROXY_DISCOVERY_INTERVAL, 30}

      proxied_agents:
        - name: "LangGraphPersonalisationAgent"
          url: ${LANGGRAPH_A2A_URL, http://192.168.4.146:10002/a2a/62d56869-cd7d-5e71-95c1-8a6aa1340ed8}

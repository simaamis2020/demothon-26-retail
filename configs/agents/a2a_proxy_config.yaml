# ============================================================================
#  A2A Proxy Agent Configuration
# ============================================================================

log:
  stdout_log_level: ${A2A_PROXY_LOG_LEVEL, INFO}
  log_file_level: DEBUG
  log_file: a2a_proxy.log

apps:
  - name: a2a_proxy_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.proxies.a2a.app

    broker:
      dev_mode: ${SOLACE_DEV_MODE, false}
      broker_url: ${SOLACE_BROKER_URL, ws://localhost:8080}
      broker_username: ${SOLACE_BROKER_USERNAME, default}
      broker_password: ${SOLACE_BROKER_PASSWORD, default}
      broker_vpn: ${SOLACE_BROKER_VPN, default}
      temporary_queue: ${USE_TEMPORARY_QUEUES, true}

    app_config:
      namespace: ${NAMESPACE}
      supports_streaming: true
      agent_name: "A2A-Proxy-Agent"
      display_name: "A2A Proxy Agent"

      artifact_service:
        type: ${ARTIFACT_SERVICE_TYPE, s3}
        bucket_name: ${S3_BUCKET_NAME}
        endpoint_url: ${S3_ENDPOINT_URL}
        aws_region: ${AWS_REGION, us-east-1}
        artifact_scope: namespace

      artifact_handling_mode: "reference"
      discovery_interval_seconds: ${A2A_PROXY_DISCOVERY_INTERVAL, 30}

      proxied_agents:
        - name: "CurrencyAgent"
          url: ${CURRENCY_AGENT_URL, http://host.minikube.internal:10000}
        - name: "LangChainPersonalisationAgent"
          url: http://host.minikube.internal:10001
